<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="MinGyun Ko Frontend Developer animated banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFF"/>
      <stop offset="55%" stop-color="#F3F0FF"/>
      <stop offset="100%" stop-color="#EEF9FF"/>
    </linearGradient>
    <linearGradient id="blobA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EA2FF"/>
      <stop offset="100%" stop-color="#B8A6FF"/>
    </linearGradient>
    <linearGradient id="blobB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ED6FF"/>
      <stop offset="100%" stop-color="#8EA2FF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#5265B8" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#4F5E9B" flood-opacity="0.20"/>
    </filter>
    <clipPath id="typeClip">
      <rect x="70" y="162" width="0" height="42" rx="4">
        <animate attributeName="width" values="0;0;540;540;0" keyTimes="0;0.08;0.48;0.86;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .float-a { animation: floatA 4.8s ease-in-out infinite; transform-origin: center; }
      .float-b { animation: floatB 5.4s ease-in-out infinite; transform-origin: center; }
      .float-c { animation: floatC 6s ease-in-out infinite; transform-origin: center; }
      .spark { animation: twinkle 2.6s ease-in-out infinite; transform-origin: center; }
      @keyframes floatA { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-10px) rotate(2deg)} }
      @keyframes floatB { 0%,100%{transform:translateY(0) rotate(4deg)} 50%{transform:translateY(9px) rotate(-2deg)} }
      @keyframes floatC { 0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-7px) rotate(3deg)} }
      @keyframes twinkle { 0%,100%{opacity:.35; transform:scale(.85)} 50%{opacity:1; transform:scale(1.18)} }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0F1220; }
        .title, .body { fill: #F7F8FC; }
        .muted { fill: #B9C0D5; }
        .outline { stroke: #2A3150; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="865" cy="70" r="74" fill="#E8E3FF" opacity="0.72"/>
  <circle cx="920" cy="230" r="58" fill="#DFF4FF" opacity="0.78"/>
  <circle cx="40" cy="285" r="52" fill="#EAF0FF" opacity="0.9"/>

  <!-- little 3D floating tech blocks -->
  <g class="float-a" filter="url(#shadow)">
    <rect x="698" y="45" width="150" height="58" rx="18" fill="url(#blobA)"/>
    <rect x="698" y="45" width="150" height="12" rx="12" fill="#FFFFFF" opacity=".28"/>
    <text x="773" y="81" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">React</text>
  </g>

  <g class="float-b" filter="url(#shadow)">
    <rect x="805" y="125" width="142" height="58" rx="18" fill="url(#blobB)"/>
    <rect x="805" y="125" width="142" height="12" rx="12" fill="#FFFFFF" opacity=".28"/>
    <text x="876" y="161" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Next.js</text>
  </g>

  <g class="float-c" filter="url(#shadow)">
    <rect x="686" y="211" width="178" height="58" rx="18" fill="#7768E8"/>
    <rect x="686" y="211" width="178" height="12" rx="12" fill="#FFFFFF" opacity=".24"/>
    <text x="775" y="247" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">TypeScript</text>
  </g>

  <!-- sparkles -->
  <g class="spark" fill="#7B86F5">
    <path d="M642 61 l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/>
  </g>
  <g class="spark" style="animation-delay:1.1s" fill="#71CFF2">
    <path d="M908 87 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
  </g>
  <g class="spark" style="animation-delay:.5s" fill="#A58CF3">
    <path d="M644 241 l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
  </g>

  <text class="title" x="70" y="92" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900" fill="#111827">MinGyun Ko</text>
  <text class="muted" x="73" y="129" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#667085">Frontend Developer · user flow · architecture · performance</text>

  <g clip-path="url(#typeClip)">
    <text class="body" x="70" y="194" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#26304A">I dig until I find the root cause.</text>
  </g>
  <rect x="71" y="166" width="4" height="34" rx="2" fill="#6F7CF7">
    <animate attributeName="x" values="71;71;603;603;71" keyTimes="0;0.08;0.48;0.86;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1;0;1" dur=".8s" repeatCount="indefinite"/>
  </rect>

  <text class="muted" x="72" y="236" font-family="Inter, Arial, sans-serif" font-size="18" fill="#687089">Build thoughtful interfaces. Improve the system behind them.</text>
  <g filter="url(#softShadow)">
    <rect x="70" y="262" width="300" height="36" rx="18" fill="#FFFFFF" opacity=".82"/>
    <text x="220" y="286" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#5A67D8">keep digging · keep improving ✦</text>
  </g>
</svg>
