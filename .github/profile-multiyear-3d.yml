name: Multi-Year 3D Contribution

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Start year for the graph"
        required: false
        default: "2024"
  schedule:
    # 03:10 KST (18:10 UTC, previous day)
    - cron: "10 18 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate multi-year 3D contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          START_YEAR: ${{ inputs.start_year || '2024' }}
          OUTPUT_FILE: profile-3d-contrib/profile-2024-now.svg
        run: node scripts/generate-multiyear-contrib.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-2024-now.svg
          if git diff --cached --quiet; then
            echo "No contribution graph changes."
            exit 0
          fi
          git commit -m "chore: update 2024-now contribution graph"
          git push
